<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LeetCode Problems by Company</title>
    <link rel="stylesheet" href="./company.css">
    <script src="../popup/theme-init.js"></script>
</head>

<body>
    <header class="page-header">
        <h1 id="title">Problems by Company</h1>
        <p class="subtitle">Frequency is relative to the company's most-asked problem (100 = asked most). "Asked recently" means reported within the last six months. Data from the community-maintained liquidslr/leetcode-company-wise-problems dataset.</p>
        <input type="text" id="companySearch" list="companyList" placeholder="Search for a company" class="search">
        <datalist id="companyList"></datalist>
        <nav id="navbar" class="company-nav"></nav>
    </header>

    <table id="solutionTable">
        <tr>
            <th id="#" class="header">#</th>
            <th id="Difficulty" class="header">Difficulty</th>
            <th id="Title" class="header">Title</th>
            <th id="Frequency" class="header">Frequency</th>
            <th id="Recent" class="header">Asked recently</th>
        </tr>
    </table>
    <script src="../../dist/problems-by-company/company.js"></script>
</body>

</html>
