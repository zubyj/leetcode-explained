<!DOCTYPE html>
<html>

<head>
    <title>Leetcode Explained</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./popup.css">
    <link rel="stylesheet" href="./prism.css">
    <script src="./theme-init.js"></script>
    <script type="module" src="../../dist/popup/popup.js"></script>
</head>

<body>
    <header class="header">
        <div class="brand">
            <img src="../assets/images/logo/icon-32.png" alt="" class="brand-icon">
            <span class="brand-name">Leetcode Explained</span>
        </div>
        <button id="settings-toggle" class="icon-button" title="Settings">⚙</button>
    </header>

    <main id="home-view" class="view">
        <p id="info-message" class="info-message">
            Open a <a href="https://leetcode.com/problems/two-sum/" target="_blank">Leetcode problem</a> to get started
        </p>

        <div class="action-row">
            <button id="fix-code-btn" class="action-button">
                <img src="../assets/images/solution-icon.png" class="action-icon" alt="">
                Solution Code
            </button>
            <button id="get-complexity-btn" class="action-button">
                <img src="../assets/images/code-icon.png" class="action-icon" alt="">
                Code Complexity
            </button>
        </div>

        <div class="response-area">
            <div id="analyze-code-response" class="response-container hidden"></div>
            <pre id="fix-code-container" class="response-container code-response hidden"><div class="code-toolbar"><button id="copy-code-btn" class="icon-button" title="Copy code"><img src="../assets/images/copy-icon.png" alt="Copy"></button><button id="clear-code-btn" class="icon-button" title="Clear response"><img src="../assets/images/clear-icon.png" alt="Clear"></button></div><code id="fix-code-response" class="language-python"></code></pre>
        </div>
    </main>

    <main id="settings-view" class="view hidden">
        <div class="settings-row">
            <label for="font-size-select">Display size</label>
            <select id="font-size-select" class="select">
                <option value="12">Small</option>
                <option value="14">Medium</option>
                <option value="16">Large</option>
            </select>
        </div>
        <div class="settings-row">
            <label for="theme-select">Theme</label>
            <select id="theme-select" class="select">
                <option value="auto">Auto</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
        <div class="settings-row toggle-row">
            <label for="show-company-tags-toggle">Company tags</label>
            <input type="checkbox" id="show-company-tags-toggle" class="toggle">
        </div>
        <div class="settings-row toggle-row">
            <label for="show-examples-toggle">Examples</label>
            <input type="checkbox" id="show-examples-toggle" class="toggle">
        </div>
        <div class="settings-row toggle-row">
            <label for="show-difficulty-toggle">Difficulty</label>
            <input type="checkbox" id="show-difficulty-toggle" class="toggle">
        </div>
        <div class="settings-row toggle-row">
            <label for="use-chatgpt-toggle" title="Answers come from your logged-in chatgpt.com session. When off, or when you are not logged in, a free hosted model is used instead.">Use my ChatGPT account</label>
            <input type="checkbox" id="use-chatgpt-toggle" class="toggle">
        </div>
        <footer class="footer">
            <a target="_blank" href="https://github.com/zubyj/leetcode-explained">Source code</a>
            <span>·</span>
            <a target="_blank" href="https://chrome.google.com/webstore/detail/leetcode-explained/cofoinjfjcpgcjiinjhcpomcjoalijbe">Leave a review</a>
        </footer>
    </main>

    <script src="./prism.js"></script>
</body>

</html>
